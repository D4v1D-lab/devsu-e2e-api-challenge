name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  e2e-python:
    name: E2E (Selenium + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (headless)
        env:
          HEADLESS: "true"
          BASE_URL: "https://www.saucedemo.com/"
          SAUCE_USERNAME: "standard_user"
          SAUCE_PASSWORD: "secret_sauce"
        run: |
          mkdir -p reports/screenshots
          pytest -v --tb=short

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: reports/
          if-no-files-found: ignore

  api-newman:
    name: API (Postman + Newman)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: postman
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: postman/package-lock.json

      - name: Install Newman
        run: npm install

      - name: Run Newman collection
        run: |
          mkdir -p ../reports
          npm test

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/newman-report.html
          if-no-files-found: ignore
